name: yks_level
description: "YKS Level - gamified YKS/TYT/AYT practice app for students in Turkey."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & routing
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0

  # Backend
  supabase_flutter: ^2.17.2

  # Firebase
  firebase_core: ^4.13.0
  firebase_analytics: ^12.4.6
  firebase_crashlytics: ^5.2.7

  # Monetization
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0

  # Local
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_dotenv: ^6.0.1

  # Misc
  intl: any
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/seed/
    - .env

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
